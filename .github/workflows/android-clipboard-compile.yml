# SPDX-License-Identifier: GPL-3.0-or-later
# Fast compile gate for the personal Android clipboard feature.
name: Android clipboard Kotlin compile
on:
  push:
    branches: [feat/android-clipboard-history-30d, personal/android-development, fix/android-isolated-test-apk, fix/android-ime-boot-recovery-smoke]
    paths:
      - 'android/**'
      - '.github/workflows/android-clipboard-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clipboard-kotlin:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/wrapper-validation@v4
      - name: Compile app Kotlin without Mozc packaging artifacts
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:compileDebugKotlin :app:testDebugUnitTest -x :mozc:checkMozcArtifacts
