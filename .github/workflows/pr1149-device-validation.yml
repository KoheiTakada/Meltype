# SPDX-License-Identifier: GPL-3.0-or-later
# Temporary reproduction of the minified release installed on the device.
name: PR 1149 release input crash reproduction
on:
  push:
    branches: [codex/pr1149-device-validation-20261105]
permissions:
  contents: read
  actions: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: 13558736408
          repository: KoheiTakada/Meltype
          run-id: 42333823307
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release
          merge-multiple: true
      - name: Prepare the exact release and a focused input field
        run: |
          set -euo pipefail
          mkdir -p repro work/src/ime/repro work/classes work/dex
          cp release/Meltype-release-unsigned.apk repro/unsigned.apk
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/repro.p12" -storetype PKCS12 -storepass android -keypass android -alias test -keyalg RSA -keysize 2048 -validity 1 -dname 'CN=Meltype test'
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/repro.p12" --ks-key-alias test --ks-pass pass:android --key-pass pass:android --out repro/Meltype.apk repro/unsigned.apk
          cat > work/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="ime.repro">
            <uses-sdk android:minSdkVersion="26" android:targetSdkVersion="35"/>
            <application android:label="IME Repro" android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true" android:windowSoftInputMode="stateAlwaysVisible" />
            </application>
          </manifest>
          EOF
          cat > work/src/ime/repro/MainActivity.java <<'EOF'
          package ime.repro;
          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Context;
          import android.view.inputmethod.InputMethodManager;
          import android.widget.EditText;
          public class MainActivity extends Activity {
            public void onCreate(Bundle saved) {
              super.onCreate(saved);
              EditText editor = new EditText(this);
              editor.setSingleLine();
              editor.setHint("Type here");
              setContentView(editor);
              editor.requestFocus();
              editor.postDelayed(() -> ((InputMethodManager)getSystemService(Context.INPUT_METHOD_SERVICE)).showSoftInput(editor, InputMethodManager.SHOW_IMPLICIT), 1000);
            }
          }
          EOF
          javac -source 8 -target 8 -bootclasspath "$ANDROID_HOME/platforms/android-36/android.jar" -d work/classes work/src/ime/repro/MainActivity.java
          "$ANDROID_HOME/build-tools/36.0.0/d8" --lib "$ANDROID_HOME/platforms/android-36/android.jar" --min-api 26 --output work/dex work/classes/ime/repro/MainActivity.class
          "$ANDROID_HOME/build-tools/36.0.0/aapt" package -f -M work/AndroidManifest.xml -I "$ANDROID_HOME/platforms/android-36/android.jar" -F work/harness-unsigned.apk
          cp work/dex/classes.dex classes.dex
          "$ANDROID_HOME/build-tools/36.0.0/aapt" add work/harness-unsigned.apk classes.dex
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f 4 work/harness-unsigned.apk work/harness-aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/repro.p12" --ks-key-alias test --ks-pass pass:android --key-pass pass:android --out repro/harness.apk work/harness-aligned.apk
      - name: Enable hardware acceleration
        run: test -e /dev/kvm && sudo chmod 666 /dev/kvm || true
      - name: Reproduce keyboard opening and typing
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disk-size: 2048M
          ram-size: 2048M
          disable-linux-hw-accel: false
          emulator-boot-timeout: 900
          disable-animations: true
          script: |
            bash -c 'adb install repro/Meltype.apk && adb install repro/harness.apk && adb shell ime enable app.meltype.keyboard/io.github.ninjin0802.keyboard.app.KeyboardService && adb shell ime set app.meltype.keyboard/io.github.ninjin0802.keyboard.app.KeyboardService && adb logcat -c && adb shell am start -W -n ime.repro/.MainActivity && sleep 5 && adb shell wm size && adb shell uiautomator dump /sdcard/window.xml && adb pull /sdcard/window.xml repro/window.xml && adb shell screencap -p /sdcard/ime.png && adb pull /sdcard/ime.png repro/ime.png && adb shell input tap 100 1500 && sleep 3 && adb logcat -b crash -d > repro/crash.log && adb logcat -d > repro/logcat.log && adb shell pidof app.meltype.keyboard > repro/pid.txt || true'
      - name: Upload reproduction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr1149-input-crash-evidence
          path: |
            repro/crash.log
            repro/logcat.log
            repro/window.xml
            repro/ime.png
            repro/pid.txt
          retention-days: 3
          if-no-files-found: warn
