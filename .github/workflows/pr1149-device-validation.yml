# SPDX-License-Identifier: GPL-3.0-or-later
# Isolated verification build: signing credentials are never sent to CI.
name: PR 1149 fixed release verification
on:
  push:
    branches: [codex/pr1149-device-validation-20261105]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 176e5a7e645689abc5d728863452eef6bef00efd
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/wrapper-validation@v4
      - name: Install Android NDK
        run: sdkmanager 'ndk;28.2.13676358'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: 13414845079
          repository: KoheiTakada/Meltype
          run-id: 42023332665
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .qa-artifact
          merge-multiple: true
      - name: Restore exact previously tested NativeAOT and Mozc
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '176e5a7e645689abc5d728863452eef6bef00efd'
          test "$(cat .qa-artifact/build/qa/source-commit.txt)" = 'a53b1ff71dfc39c98e0cf45186c7710ec73c4fc5'
          grep -qx 'Expected: 36' .qa-artifact/build/qa/summary.md
          grep -qx 'Passed: 36' .qa-artifact/build/qa/summary.md
          git diff --exit-code a53b1ff71dfc39c98e0cf45186c7710ec73c4fc5 HEAD -- android/mozc/ android/tools/build-mozc.sh android/tools/build-meltype-native.sh src/Meltype.Core/ src/Meltype.Mac.Native/
          python3 - <<'PY'
          import pathlib, zipfile
          apk = pathlib.Path('.qa-artifact/app/build/outputs/apk/debug/app-debug.apk')
          with zipfile.ZipFile(apk) as src:
              for abi in ('arm64-v8a', 'x86_64'):
                  for name, dst in (
                      ('libMeltypeNative.so', pathlib.Path('android/app/prebuilt') / abi / 'libMeltypeNative.so'),
                      ('libmozc.so', pathlib.Path('android/mozc/src/main/jniLibs') / abi / 'libmozc.so'),
                  ):
                      dst.parent.mkdir(parents=True, exist_ok=True)
                      dst.write_bytes(src.read(f'lib/{abi}/{name}'))
              for name in ('mozc.data', 'MOZC_NOTICES.txt'):
                  dst = pathlib.Path('android/mozc/src/main/assets') / name
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  dst.write_bytes(src.read(f'assets/{name}'))
          PY
      - name: Build debug tests and minified release
        working-directory: android
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
          MELTYPE_VERSION_CODE: '8'
          MELTYPE_VERSION_NAME: '0.1.8'
        run: ./gradlew --no-daemon :engine:test :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease
      - name: Verify release package and prepare test-only signature
        run: |
          set -euo pipefail
          mkdir -p delivery repro work/src/ime/repro work/classes work/dex
          apk=android/app/build/outputs/apk/release/app-release-unsigned.apk
          python3 android/tools/check-apk-16k.py "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | tee delivery/package.txt
          grep -q "package: name='app.meltype.keyboard' versionCode='8'" delivery/package.txt
          ! grep -q 'application-debuggable' delivery/package.txt
          grep -q 'application-icon-' delivery/package.txt
          cp "$apk" delivery/Meltype-release-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" delivery/apksigner.jar
          sha256sum delivery/Meltype-release-unsigned.apk > delivery/unsigned.sha256
          git rev-parse HEAD > delivery/source-commit.txt
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/repro.p12" -storetype PKCS12 -storepass android -keypass android -alias test -keyalg RSA -keysize 2048 -validity 1 -dname 'CN=Meltype test'
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/repro.p12" --ks-key-alias test --ks-pass pass:android --key-pass pass:android --out repro/Meltype.apk "$apk"
      - name: Build isolated input-field and icon viewer
        run: |
          set -euo pipefail
          cat > work/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="ime.repro">
            <uses-sdk android:minSdkVersion="26" android:targetSdkVersion="35"/>
            <queries><package android:name="app.meltype.keyboard"/></queries>
            <application android:label="IME Repro" android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true" android:windowSoftInputMode="stateAlwaysVisible" />
              <activity android:name=".IconActivity" android:exported="true" />
            </application>
          </manifest>
          EOF
          cat > work/src/ime/repro/MainActivity.java <<'EOF'
          package ime.repro;
          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Context;
          import android.view.inputmethod.InputMethodManager;
          import android.widget.EditText;
          public class MainActivity extends Activity {
            public void onCreate(Bundle saved) {
              super.onCreate(saved);
              EditText editor = new EditText(this);
              editor.setSingleLine();
              editor.setHint("Type here");
              setContentView(editor);
              editor.requestFocus();
              editor.postDelayed(new Runnable() { public void run() { ((InputMethodManager)getSystemService(Context.INPUT_METHOD_SERVICE)).showSoftInput(editor, InputMethodManager.SHOW_IMPLICIT); } }, 1000);
            }
          }
          EOF
          cat > work/src/ime/repro/IconActivity.java <<'EOF'
          package ime.repro;
          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.widget.ImageView;
          import android.view.Gravity;
          import android.widget.FrameLayout;
          public class IconActivity extends Activity {
            public void onCreate(Bundle saved) {
              super.onCreate(saved);
              FrameLayout root = new FrameLayout(this);
              root.setBackgroundColor(Color.rgb(220,225,230));
              ImageView icon = new ImageView(this);
              try { icon.setImageDrawable(getPackageManager().getApplicationIcon("app.meltype.keyboard")); }
              catch (Exception e) { throw new IllegalStateException(e); }
              int size = (int)(160 * getResources().getDisplayMetrics().density);
              FrameLayout.LayoutParams p = new FrameLayout.LayoutParams(size, size, Gravity.CENTER);
              root.addView(icon,p);
              setContentView(root);
            }
          }
          EOF
          javac -source 8 -target 8 -bootclasspath "$ANDROID_HOME/platforms/android-36/android.jar" -d work/classes work/src/ime/repro/*.java
          "$ANDROID_HOME/build-tools/36.0.0/d8" --lib "$ANDROID_HOME/platforms/android-36/android.jar" --min-api 26 --output work/dex work/classes/ime/repro/*.class
          "$ANDROID_HOME/build-tools/36.0.0/aapt" package -f -M work/AndroidManifest.xml -I "$ANDROID_HOME/platforms/android-36/android.jar" -F work/harness-unsigned.apk
          cp work/dex/classes.dex classes.dex
          "$ANDROID_HOME/build-tools/36.0.0/aapt" add work/harness-unsigned.apk classes.dex
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f 4 work/harness-unsigned.apk work/harness-aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/repro.p12" --ks-key-alias test --ks-pass pass:android --key-pass pass:android --out repro/harness.apk work/harness-aligned.apk
          cat > repro/run.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          trap 'adb logcat -b crash -d > repro/crash.log || true; adb logcat -d > repro/logcat.log || true' EXIT
          bash android/tools/run-instrumentation-tests.sh
          adb install repro/Meltype.apk
          adb install repro/harness.apk
          adb shell am start -W -n ime.repro/.IconActivity
          sleep 2
          adb shell screencap -p /sdcard/icon.png
          adb pull /sdcard/icon.png repro/icon.png
          adb shell ime enable app.meltype.keyboard/io.github.ninjin0802.keyboard.app.KeyboardService
          adb shell ime set app.meltype.keyboard/io.github.ninjin0802.keyboard.app.KeyboardService
          adb logcat -c
          adb shell am start -W -n ime.repro/.MainActivity
          sleep 5
          adb shell screencap -p /sdcard/keyboard.png
          adb pull /sdcard/keyboard.png repro/keyboard.png
          # arigatou, then Enter, then Space. The emulator is 320 x 640.
          for xy in '25 495' '115 441' '235 441' '145 495' '25 495' '145 441' '265 441' '205 441'; do
            adb shell input tap $xy
            sleep 0.25
          done
          sleep 2
          adb shell input tap 280 603
          sleep 2
          adb shell uiautomator dump /sdcard/after-enter.xml
          adb pull /sdcard/after-enter.xml repro/after-enter.xml
          adb shell input tap 155 603
          sleep 2
          adb shell uiautomator dump /sdcard/after-space.xml
          adb pull /sdcard/after-space.xml repro/after-space.xml
          adb shell pidof app.meltype.keyboard
          adb logcat -b crash -d > repro/crash.log
          if grep -q 'app.meltype.keyboard' repro/crash.log; then cat repro/crash.log; exit 1; fi
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          def text(path):
              tree = ET.parse(path)
              return next(n.attrib.get('text','') for n in tree.iter('node') if n.attrib.get('class') == 'android.widget.EditText')
          before = text('repro/after-enter.xml')
          after = text('repro/after-space.xml')
          print('Committed text:', repr(before))
          print('After space:', repr(after))
          assert before in ('ありがとう', '有難う', '有り難う'), f'Unexpected Japanese input: {before!r}'
          assert after == before + ' ', f'Expected half-width space: {after!r}'
          PY
          EOF
          chmod +x repro/run.sh
      - name: Enable hardware acceleration
        run: test -e /dev/kvm && sudo chmod 666 /dev/kvm || true
      - name: Run device tests and actual release typing
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disk-size: 2048M
          ram-size: 2048M
          disable-linux-hw-accel: false
          emulator-boot-timeout: 900
          disable-animations: true
          script: bash repro/run.sh
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr1149-fixed-verification-evidence
          path: |
            repro/*.png
            repro/*.xml
            repro/*.log
            android/build/qa/
          retention-days: 7
          if-no-files-found: warn
      - name: Upload unsigned release for private signing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pr1149-fixed-release-for-private-signing
          path: delivery/
          retention-days: 7
          if-no-files-found: error
