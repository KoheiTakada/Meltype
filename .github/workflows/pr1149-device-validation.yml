# SPDX-License-Identifier: GPL-3.0-or-later
# Temporary build on the fork; no signing secrets are used in this workflow.
name: PR 1149 distribution APK build
on:
  push:
    branches: [codex/pr1149-device-validation-20261105]
permissions:
  contents: read
  actions: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a53b1ff71dfc39c98e0cf45186c7710ec73c4fc5
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/wrapper-validation@v4
      - name: Install Android NDK
        run: sdkmanager 'ndk;28.2.13676358'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: 13414845079
          repository: KoheiTakada/Meltype
          run-id: 42023332665
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .qa-artifact
          merge-multiple: true
      - name: Restore native libraries from the successful QA build
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'a53b1ff71dfc39c98e0cf45186c7710ec73c4fc5'
          test "$(cat .qa-artifact/build/qa/source-commit.txt)" = "$(git rev-parse HEAD)"
          grep -qx 'Expected: 36' .qa-artifact/build/qa/summary.md
          grep -qx 'Passed: 36' .qa-artifact/build/qa/summary.md
          python3 - <<'PY'
          import pathlib, zipfile
          apk = pathlib.Path('.qa-artifact/app/build/outputs/apk/debug/app-debug.apk')
          with zipfile.ZipFile(apk) as src:
              for abi in ('arm64-v8a', 'x86_64'):
                  for name, dst in (
                      ('libMeltypeNative.so', pathlib.Path('android/app/prebuilt') / abi / 'libMeltypeNative.so'),
                      ('libmozc.so', pathlib.Path('android/mozc/src/main/jniLibs') / abi / 'libmozc.so'),
                  ):
                      dst.parent.mkdir(parents=True, exist_ok=True)
                      dst.write_bytes(src.read(f'lib/{abi}/{name}'))
              for name in ('mozc.data', 'MOZC_NOTICES.txt'):
                  dst = pathlib.Path('android/mozc/src/main/assets') / name
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  dst.write_bytes(src.read(f'assets/{name}'))
          PY
      - name: Build production release variant
        working-directory: android
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
          MELTYPE_VERSION_CODE: '7'
          MELTYPE_VERSION_NAME: '0.1.7'
        run: ./gradlew --no-daemon :engine:test :app:testDebugUnitTest :app:assembleRelease
      - name: Verify package and 16 KiB alignment
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release-unsigned.apk
          python3 android/tools/check-apk-16k.py "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep "package: name='app.meltype.keyboard' versionCode='7'"
          mkdir -p delivery
          cp "$apk" delivery/Meltype-release-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" delivery/apksigner.jar
          sha256sum delivery/Meltype-release-unsigned.apk > delivery/unsigned.sha256
          git rev-parse HEAD > delivery/source-commit.txt
      - name: Sign a disposable copy for emulator smoke test
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/smoke.p12" -storetype PKCS12 -storepass android -keypass android -alias smoke -keyalg RSA -keysize 2048 -validity 1 -dname 'CN=Meltype temporary smoke test'
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/smoke.p12" --ks-key-alias smoke --ks-pass pass:android --key-pass pass:android --out "$RUNNER_TEMP/Meltype-smoke.apk" delivery/Meltype-release-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$RUNNER_TEMP/Meltype-smoke.apk"
      - name: Enable hardware acceleration
        run: test -e /dev/kvm && sudo chmod 666 /dev/kvm || true
      - name: Smoke test release variant on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disk-size: 2048M
          ram-size: 2048M
          disable-linux-hw-accel: false
          emulator-boot-timeout: 900
          disable-animations: true
          script: |
            adb install "$RUNNER_TEMP/Meltype-smoke.apk"
            adb shell am start -W -n app.meltype.keyboard/io.github.ninjin0802.keyboard.app.MainActivity
            adb shell pidof app.meltype.keyboard
            adb shell ime list -a | grep -F 'app.meltype.keyboard/io.github.ninjin0802.keyboard.app.KeyboardService'
            adb shell ime enable app.meltype.keyboard/io.github.ninjin0802.keyboard.app.KeyboardService
            adb shell ime set app.meltype.keyboard/io.github.ninjin0802.keyboard.app.KeyboardService
      - name: Upload unsigned release for private signing
        uses: actions/upload-artifact@v4
        with:
          name: pr1149-release-for-private-signing
          path: delivery/
          retention-days: 7
          if-no-files-found: error
