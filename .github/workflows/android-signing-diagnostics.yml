name: Meltype signing diagnostics
on:
  push:
    branches: [codex/verify-signing-20261105]
permissions: {}
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify key and password without exposing their values
        env:
          CHECK_KEY_B64: ${{ secrets.MELTYPE_SIGNING_KEYSTORE_BASE64 }}
          CHECK_PASSWORD: ${{ secrets.MELTYPE_SIGNING_PASSWORD }}
          EXPECTED_KEYSTORE_SHA256: f3e1cc9f38d7ae462812baff63bd90f3562057d279509581be5c9fb8e2695fe8
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import base64, binascii, hashlib, os, re, subprocess, sys, tempfile
          from pathlib import Path
          raw = os.environ.get('CHECK_KEY_B64', '')
          password = os.environ.get('CHECK_PASSWORD', '')
          if not raw or not password:
              print('Required signing secret is missing')
              sys.exit(1)
          candidates = [raw.strip(), ''.join(raw.split())]
          candidates += re.findall(r'[A-Za-z0-9+/=]{1000,}', raw)
          good = None
          for candidate in candidates:
              try:
                  decoded = base64.b64decode(candidate, validate=True)
              except (binascii.Error, ValueError):
                  continue
              if hashlib.sha256(decoded).hexdigest() == os.environ['EXPECTED_KEYSTORE_SHA256']:
                  good = decoded
                  break
          print('Keystore matches backup:', good is not None)
          if good is None:
              sys.exit(1)
          fd, path = tempfile.mkstemp(suffix='.p12')
          try:
              with os.fdopen(fd, 'wb') as output:
                  output.write(good)
              results = []
              for label, value in [('as registered', password), ('without trailing CR/LF', password.rstrip('\r\n'))]:
                  env = os.environ.copy()
                  env['CHECK_TEMP_PASSWORD'] = value
                  result = subprocess.run(['keytool', '-list', '-storetype', 'PKCS12', '-keystore', path,
                                           '-storepass:env', 'CHECK_TEMP_PASSWORD', '-alias', 'meltype'],
                                          env=env, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=30)
                  valid = result.returncode == 0
                  results.append(valid)
                  print('Password ' + label + ' validates:', valid)
              if not any(results):
                  sys.exit(1)
          finally:
              Path(path).unlink(missing_ok=True)
          PY
