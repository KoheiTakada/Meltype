name: PR 1149 report examples verification
on:
  push:
    branches: [codex/pr1149-merge-validation-20261105]
permissions:
  contents: read
jobs:
  expectations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out exact upstream merge
        run: |
          git fetch --no-tags https://github.com/yksr-melt/Meltype.git '24ef0fb12de22e63c7d812df84bc3b61486d18a3'
          git checkout --detach '24ef0fb12de22e63c7d812df84bc3b61486d18a3'
          test "$(git show -s --format=%P HEAD)" = 'ea61481e710b64c940d7ea1f856cbaeb2d10fc02 176e5a7e645689abc5d728863452eef6bef00efd'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Extract actual PR examples
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/yksr-melt/Meltype/pulls/1149 | jq '{pull_request:{body:.body}}' > "$RUNNER_TEMP/pr-event.json"
          GITHUB_EVENT_PATH="$RUNNER_TEMP/pr-event.json" node .github/bot/pr-checks.mjs cases "$RUNNER_TEMP/cases.txt"
          test "$(wc -l < "$RUNNER_TEMP/cases.txt")" -eq 3
      - name: Fetch current released Mozc helper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo yksr-melt/Meltype --pattern 'Meltype-*-linux.zip' --dir "$RUNNER_TEMP/release"
          unzip -q "$RUNNER_TEMP"/release/*.zip -d "$RUNNER_TEMP/release"
          helper="$RUNNER_TEMP/release/Meltype-linux/mozc/meltype_mozc_helper"
          chmod +x "$helper"
          echo "MELTYPE_MOZC=$helper" >> "$GITHUB_ENV"
      - name: Verify PR examples
        run: |
          dotnet run --project src/Meltype.Core.Tests -c Release -- --expect "$RUNNER_TEMP/cases.txt" "$RUNNER_TEMP/cases.json"
          node .github/bot/pr-checks.mjs expect "$RUNNER_TEMP/cases.json"
