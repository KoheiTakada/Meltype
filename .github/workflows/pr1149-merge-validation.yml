name: PR 1149 merge validation
on:
  push:
    branches: [codex/pr1149-merge-validation-20261105]
permissions:
  contents: read
env:
  UPSTREAM_BASE: ea61481e710b64c940d7ea1f856cbaeb2d10fc02
  UPSTREAM_MERGE: 24ef0fb12de22e63c7d812df84bc3b61486d18a3
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare and verify the exact upstream merge tree
        shell: bash
        run: |
          git fetch --no-tags https://github.com/yksr-melt/Meltype.git "$UPSTREAM_BASE" "$UPSTREAM_MERGE"
          git checkout --detach "$UPSTREAM_MERGE"
          test "$(git show -s --format=%P HEAD)" = 'ea61481e710b64c940d7ea1f856cbaeb2d10fc02 176e5a7e645689abc5d728863452eef6bef00efd'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Shared Core regression tests
        run: dotnet run --project src/Meltype.Core.Tests/Meltype.Core.Tests.csproj -c Release
      - name: Linux Unicode key mapping
        run: python3 linux/tests/test_virtual_key.py
      - name: Mozc-UT dictionary merge
        run: python3 native/mozc/tests/test_merge_ut_dictionary.py
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare and verify the exact upstream merge tree
        shell: bash
        run: |
          git fetch --no-tags https://github.com/yksr-melt/Meltype.git "$UPSTREAM_BASE" "$UPSTREAM_MERGE"
          git checkout --detach "$UPSTREAM_MERGE"
          test "$(git show -s --format=%P HEAD)" = 'ea61481e710b64c940d7ea1f856cbaeb2d10fc02 176e5a7e645689abc5d728863452eef6bef00efd'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build Meltype.sln -c Release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Mozc-UT dictionary merge
        run: python native/mozc/tests/test_merge_ut_dictionary.py
      - name: Build Meltype IME
        shell: pwsh
        run: ./native/tip/build.ps1 -Configuration Release
      - name: Test package scan failure handling
        shell: powershell
        run: .\tools\Test-WindowsPackageScan.ps1
      - name: Windows regression tests
        run: dotnet run --project src/Meltype.Tests/Meltype.Tests.csproj -c Release --no-build
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare and verify the exact upstream merge tree
        shell: bash
        run: |
          git fetch --no-tags https://github.com/yksr-melt/Meltype.git "$UPSTREAM_BASE" "$UPSTREAM_MERGE"
          git checkout --detach "$UPSTREAM_MERGE"
          test "$(git show -s --format=%P HEAD)" = 'ea61481e710b64c940d7ea1f856cbaeb2d10fc02 176e5a7e645689abc5d728863452eef6bef00efd'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check whitespace
        run: dotnet format whitespace --folder --verify-no-changes
      - name: Build with recommended analyzers
        run: dotnet build src/Meltype.Core/Meltype.Core.csproj -c Release -p:AnalysisLevel=latest-recommended
  accuracy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out exact upstream merge and base
        run: |
          git fetch --no-tags https://github.com/yksr-melt/Meltype.git "$UPSTREAM_BASE" "$UPSTREAM_MERGE"
          git checkout --detach "$UPSTREAM_MERGE"
          test "$(git show -s --format=%P HEAD)" = 'ea61481e710b64c940d7ea1f856cbaeb2d10fc02 176e5a7e645689abc5d728863452eef6bef00efd'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compare accuracy with upstream main
        run: |
          set -euo pipefail
          dotnet run --project src/Meltype.Core.Tests -c Release -- --eval-json "$RUNNER_TEMP/pr.json"
          dotnet run --project src/Meltype.Core.Tests -c Release -- --judge-corpus "$RUNNER_TEMP/pr-words.tsv"
          git worktree add "$RUNNER_TEMP/base" "$UPSTREAM_BASE"
          dotnet run --project "$RUNNER_TEMP/base/src/Meltype.Core.Tests" -c Release -- --eval-json "$RUNNER_TEMP/base.json"
          dotnet run --project "$RUNNER_TEMP/base/src/Meltype.Core.Tests" -c Release -- --judge-corpus "$RUNNER_TEMP/base-words.tsv" "$RUNNER_TEMP/pr-words.tsv"
          dotnet run --project src/Meltype.Core.Tests -c Release -- --judge-corpus "$RUNNER_TEMP/pr-words.tsv" "$RUNNER_TEMP/base-words.tsv"
          node .github/bot/pr-checks.mjs impact "$RUNNER_TEMP/base-words.tsv" "$RUNNER_TEMP/pr-words.tsv" "$RUNNER_TEMP/changes.tsv"
          node .github/bot/pr-checks.mjs compare "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/pr.json"
  codeql:
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, c-cpp, javascript-typescript, python, actions]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare and verify the exact upstream merge tree
        shell: bash
        run: |
          git fetch --no-tags https://github.com/yksr-melt/Meltype.git "$UPSTREAM_BASE" "$UPSTREAM_MERGE"
          git checkout --detach "$UPSTREAM_MERGE"
          test "$(git show -s --format=%P HEAD)" = 'ea61481e710b64c940d7ea1f856cbaeb2d10fc02 176e5a7e645689abc5d728863452eef6bef00efd'
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
