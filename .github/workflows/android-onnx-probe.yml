# SPDX-License-Identifier: GPL-3.0-or-later
name: Android ONNX CPU probe (no model)
on:
  push:
    branches: [exp/android-local-onnx-reranker]
    paths:
      - 'android/onnx-probe/**'
      - 'android/settings.gradle.kts'
      - 'android/gradle/libs.versions.toml'
      - '.github/workflows/android-onnx-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-probe-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/wrapper-validation@v4
      - name: Test CPU reranker and build Android AAR
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :onnx-probe:testDebugUnitTest :onnx-probe:assembleDebug
      - name: Upload experimental AAR and unit test XML
        uses: actions/upload-artifact@v4
        with:
          name: android-onnx-cpu-probe-aar
          path: |
            android/onnx-probe/build/outputs/aar/
            android/onnx-probe/build/test-results/testDebugUnitTest/
          retention-days: 14
