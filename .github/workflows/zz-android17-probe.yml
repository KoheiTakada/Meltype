# Temporary: diagnose the Android 17 emulator job without the 30-minute rebuild.
# Remove before this branch is proposed anywhere.
name: zz Android 17 probe (temporary)
on:
  pull_request:
    paths:
      - '.github/workflows/zz-android17-probe.yml'
      - 'android/tools/probe-android17.sh'
      - 'android/tools/run-instrumentation-tests.sh'
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: api37.0-google_apis
            api: '37.0'
            target: google_apis
            nav: ''
          - label: api37.1-google_apis_ps16k
            api: '37.1'
            target: google_apis_ps16k
            nav: ''
          - label: api37.2-google_apis_ps16k
            api: '37.2'
            target: google_apis_ps16k
            nav: ''
          - label: api37.0-google_apis_ps16k-threebutton
            api: '37.0'
            target: google_apis_ps16k
            nav: threebutton
    name: probe (${{ matrix.label }})
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;36.0.0'
      - uses: actions/download-artifact@v4
        with:
          name: android-qa-report-and-debug-apk
          path: android
          run-id: 42851632923
          github-token: ${{ github.token }}
      - run: |
          yes | sdkmanager --install 'cmdline-tools;latest' > /dev/null
          test -e /dev/kvm && sudo chmod 666 /dev/kvm || true
      - if: matrix.label == 'api37.0-google_apis'
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo '--- stable channel android-37 images'
          "$SDKM" --list --channel=0 2>/dev/null | grep 'system-images;android-37' | sort -u || true
          echo '--- canary channel android-37 images'
          "$SDKM" --list --channel=3 2>/dev/null | grep 'system-images;android-37' | sort -u || true
          echo '--- emulator packages'
          "$SDKM" --list --channel=3 2>/dev/null | grep -E '^ *emulator ' | sort -u || true
          "$SDKM" --list --channel=0 2>/dev/null | grep -E '^ *emulator ' | sort -u || true
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disk-size: 4096M
          ram-size: 4096M
          disable-linux-hw-accel: false
          emulator-boot-timeout: 900
          disable-animations: true
          script: |
            PROBE_NAV=${{ matrix.nav }} bash android/tools/probe-android17.sh ${{ matrix.label }} run-tests
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-17-probe-${{ matrix.label }}
          path: android/build/qa/
          if-no-files-found: warn
