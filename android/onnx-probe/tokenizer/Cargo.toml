[package]
name = "meltype_tokenizer"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "=0.21.1"
tokenizers = { version = "=0.22.1", default-features = false, features = ["onig"] }

[profile.release]
opt-level = 2
strip = true
